<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Dharwin">
  <!--
    Two rounded squares interlocking. The overlap is a real hole, not a white
    fill, so the mark sits correctly on any ground: app chrome, dark theme, and
    the warm paper of the email layout.
  -->
  <defs>
    <mask id="dharwin-notch">
      <rect width="512" height="512" fill="#ffffff"/>
      <rect x="190" y="190" width="132" height="132" rx="34" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#dharwin-notch)">
    <rect x="190" y="100" width="222" height="222" rx="56" fill="#45A15E"/>
    <rect x="100" y="190" width="222" height="222" rx="56" fill="#1E3A5F"/>
  </g>
</svg>
